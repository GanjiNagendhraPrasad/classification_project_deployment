<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Model Prediction</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5, #9face6);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            background: #ffffff;
            width: 450px;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .profile {
            text-align: center;
            margin-bottom: 20px;
        }

        .profile img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: contain;
            border: 4px solid #007bff;
            display: block;
            margin: 0 auto 10px;
            background: #fff;
        }



        .profile h2 {
            margin: 0;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #007bff;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
            color: #444;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #007bff;
            color: #fff;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        .result {
            margin-top: 20px;
            text-align: center;
            font-size: 20px;
            color: green;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- Profile Section -->
    <div class="profile">
        <!-- Update image path if needed -->
        <img src="{{ url_for('static', filename='profile.jpg') }}" alt="Profile">



        <h2>G Nagendhra Prasad</h2>
    </div>

    <h1>Model Prediction</h1>

    <form method="post">
        <label>Long Hair</label>
        <input type="number" step="any" name="Long hair" required>

        <label>Forehead Width (cm)</label>
        <input type="number" step="any" name="forehead_width_cm" required>

        <label>Forehead Height (cm)</label>
        <input type="number" step="any" name="forehead_height_cm" required>

        <label>Nose Wide</label>
        <input type="number" step="any" name="nose_wide" required>

        <label>Nose Long</label>
        <input type="number" step="any" name="nose_long" required>

        <label>Lips Thin</label>
        <input type="number" step="any" name="lips_thin" required>

        <label>Distance Nose to Lip Long</label>
        <input type="number" step="any" name="distance_nose_to_lip_long" required>

        <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
        <div class="result">
            Prediction: {{ prediction }}
        </div>
    {% endif %}

</div>

</body>
</html>
